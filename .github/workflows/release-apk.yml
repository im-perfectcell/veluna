name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Veluna APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare deterministic signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 secret..."
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using checked-in debug.keystore..."
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding checked-in debug.keystore.base64..."
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "SECRET_KEYSTORE_B64 is empty and debug.keystore.base64 not in checkout; restoring deterministic project debug.keystore..."
            printf '%s' '' | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Error: failed to materialize debug.keystore"
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Prepare Firebase Google Services config
        env:
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SECRET_GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$SECRET_GOOGLE_SERVICES_JSON" ]; then
            echo "Using GOOGLE_SERVICES_JSON secret..."
            printf '%s\n' "$SECRET_GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "$SECRET_GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Decoding GOOGLE_SERVICES_JSON_B64 secret..."
            printf '%s' "$SECRET_GOOGLE_SERVICES_JSON_B64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          elif [ -s app/google-services.json ]; then
            echo "Using checked-in app/google-services.json..."
          else
            echo "app/google-services.json not in checkout; restoring project google-services.json..."
            printf '%s' '' | base64 -d > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "Error: failed to materialize app/google-services.json"
            exit 1
          fi
          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>' \
              '<resources>' \
              '    <string name="firestore_database_id" translatable="false">ai-studio-android-veluna-19b2b641-8c36-4a56-b277-5b81c63f187c</string>' \
              '</resources>' > app/src/main/res/values/firebase_applet_config.xml
          fi
          ls -lh app/google-services.json app/src/main/res/values/firebase_applet_config.xml

      - name: Build installable APK
        run: |
          VER_CODE=$((10 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF_NAME#v}"
          else
            VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -PvelunaVersionCode="${VER_CODE}" \
            -PvelunaVersionName="${VER_NAME}"

      - name: Prepare and verify APK asset
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Built APK not found or empty"
            exit 1
          fi
          cp "$APK_PATH" dist/veluna-android.apk
          unzip -tqq dist/veluna-android.apk
          keytool -printcert -jarfile dist/veluna-android.apk | grep -E "SHA1:|SHA256:" || true
          ls -lh dist/veluna-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: veluna-android-apk
          path: dist/veluna-android.apk
          retention-days: 30

      - name: Determine release metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=Veluna ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Veluna Latest Build" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            Installable Android APK for **Veluna** (Android 8.0+ / API 26+).

            ### How to Install
            1. Download `veluna-android.apk` from the **Assets** section below.
            2. Open the downloaded file on your Android device.
            3. Allow **Install unknown apps** if prompted by Android, then tap **Install**.
          files: dist/veluna-android.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
