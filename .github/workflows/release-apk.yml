name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Veluna APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare and verify APK asset
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Built APK not found or empty"
            exit 1
          fi
          cp "$APK_PATH" dist/veluna-android.apk
          unzip -tqq dist/veluna-android.apk
          ls -lh dist/veluna-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: veluna-android-apk
          path: dist/veluna-android.apk
          retention-days: 30

      - name: Determine release metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=Veluna ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Veluna Latest Build" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            Installable Android APK for **Veluna** (Android 8.0+ / API 26+).

            ### How to Install
            1. Download `veluna-android.apk` from the **Assets** section below.
            2. Open the downloaded file on your Android device.
            3. Allow **Install unknown apps** if prompted by Android, then tap **Install**.
          files: dist/veluna-android.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
